# Actualizaciones de dependencias. Se revisan cada semana (ROADMAP, Fase 9).
# Cada PR abre una preview en Vercel y una rama en Neon (Neon Free: 10 ramas, LIMITS D4): por eso
# las versiones menores y parches van juntos en una sola PR y hay un tope de PR abiertas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      menores-y-parches:
        patterns: ["*"]
        # SDK de Neon Auth en beta y con versión fijada: PR propia y leer su CHANGELOG antes de fusionar
        exclude-patterns: ["@neondatabase/auth"]
        update-types: [minor, patch]
    # Las versiones mayores llegan en PR sueltas (pueden romper: revisar notas de la versión)
    ignore:
      # Los tipos de Node siguen la versión con la que se ejecuta la app (Node 24 en la CI; en Vercel, la de Settings → Node.js Version):
      # unos tipos más nuevos dejarían usar funciones que en producción no existen. Subir la mayor a mano
      # cuando se cambie la versión de Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
    groups:
      acciones:
        patterns: ["*"]
